# XcodeGen spec for the iPhone app (generate with scripts/build.sh, or `xcodegen generate`).
# The routing engine is linked in as a static library (routing-engine/ffi) and the Israel
# graphs ship inside the app, so routing works offline.
name: ShepherdPhone
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${SHEPHERD_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Shepherd:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # Shared with the Mac app.
      - path: ../ShepherdMac/Sources/Shepherd/API.swift
        group: Shared
      - path: ../ShepherdMac/Sources/Shepherd/Navigation.swift
        group: Shared
      - path: ../ShepherdMac/Sources/Shepherd/Search.swift
        group: Shared
      # Routing data (memory-mapped from the app bundle).
      - path: ../../routing-engine/data/il.graph
        group: Data
        buildPhase: resources
      - path: ../../routing-engine/data/il-foot.graph
        group: Data
        buildPhase: resources
      - path: ../../routing-engine/data/judea-samaria.geojson
        group: Data
        buildPhase: resources
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Shepherd
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: Shepherd uses your location to route from where you are and to guide you turn by turn.
        NSLocationAlwaysAndWhenInUseUsageDescription: Shepherd keeps guiding you with the screen locked while you navigate.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${SHEPHERD_BUNDLE_ID}
        PRODUCT_NAME: Shepherd
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../../routing-engine/ffi/include
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/../../routing-engine/ffi/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../routing-engine/ffi/target/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: [-lshepherd_ffi]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        # The engine library is built for arm64 only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
