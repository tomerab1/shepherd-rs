[package]
name = "routing-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
osmpbf = "0.3.4"
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rstar = "0.12"
axum = { version = "0.8", optional = true }
tokio = { version = "1.54.1", features = ["full"], optional = true }
clap = { version = "4.6.10", features = ["derive", "env"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", optional = true }
arc-swap = "1.9.5"
serde_json = "1.0.154"
thiserror = "2.0.21"
memmap2 = "0.9.12"
bytemuck = { version = "1.25.2", features = ["derive"] }
mimalloc = { version = "0.1.52", optional = true }
parking_lot = "0.13.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "query"], optional = true }

[features]
# The HTTP server, CLI and live-traffic poller. Off for embedding the engine (e.g. the iPhone app).
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:clap", "dep:tracing-subscriber", "dep:mimalloc", "dep:reqwest"]

[[bin]]
name = "shepherd"
path = "src/main.rs"
required-features = ["server"]

[profile.release]
# These settings are recommended for maximum performance in release mode.
opt-level = 3           # Maximum optimization
debug = "line-tables-only"
lto = true              # Enable Link Time Optimization for further speed improvements
codegen-units = 1       # Fewer codegen units can yield better optimizations at the cost of longer compile times

[dev-dependencies]
rand = "0.8"
