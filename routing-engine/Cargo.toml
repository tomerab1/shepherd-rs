[package]
name = "routing-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
osmpbf = "0.3.4"
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rstar = "0.12"
axum = "0.8"
tokio = { version = "1.54.1", features = ["full"] }
clap = { version = "4.6.10", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
arc-swap = "1.9.5"
serde_json = "1.0.154"
thiserror = "2.0.21"
memmap2 = "0.9.12"
bytemuck = { version = "1.25.2", features = ["derive"] }
mimalloc = "0.1.52"
parking_lot = "0.13.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "query"] }

[[bin]]
name = "shepherd"
path = "src/main.rs"

[profile.release]
# These settings are recommended for maximum performance in release mode.
opt-level = 3           # Maximum optimization
debug = "line-tables-only"
lto = true              # Enable Link Time Optimization for further speed improvements
codegen-units = 1       # Fewer codegen units can yield better optimizations at the cost of longer compile times

[dev-dependencies]
rand = "0.8"
