[package]
name = "shepherd-ffi"
version = "0.1.0"
edition = "2021"
description = "C interface to the Shepherd routing engine, for embedding it in apps (iOS)."

[lib]
crate-type = ["staticlib"]

[dependencies]
routing-engine = { path = "..", default-features = false }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# Standalone: not part of a workspace.
[workspace]
